<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源状态检查 | 光影集</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1a1a1a',
                        secondary: '#666666',
                        accent: '#d4af37',
                        success: '#4CAF50',
                        danger: '#f44336',
                        warning: '#ff9800', // 新增警告色（用于未配置密钥等状态）
                        light: '#f8f8f8',
                        dark: '#0f0f0f'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .status-indicator {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                display: inline-block;
            }
            .resource-item {
                transition: all 0.3s ease;
            }
            .resource-item:hover {
                background-color: rgba(212, 175, 55, 0.05);
            }
            .fade-in {
                animation: fadeIn 0.5s ease-in;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="bg-light text-primary min-h-screen">
    <!-- 导航栏 -->
    <header class="bg-white shadow-sm py-4 sticky top-0 z-30">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <!-- 调大左上角"光影"字样 -->
            <h1 class="text-2xl md:text-3xl font-display font-light tracking-wide">
                <span class="text-primary">光影</span><span class="text-accent">.</span>
                <span class="text-sm text-secondary ml-2">资源状态检查</span>
            </h1>
            <a href="index.html" class="text-sm text-secondary hover:text-accent transition-colors flex items-center">
                <i class="fa fa-arrow-left mr-1"></i> 返回主页
            </a>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-6 py-10">
        <!-- 总体状态 -->
        <div class="mb-8 p-6 bg-white rounded-lg shadow-sm">
            <h2 class="text-xl font-medium mb-4 flex items-center">
                <i class="fa fa-dashboard text-accent mr-2"></i> 总体状态
            </h2>
            <div id="summary" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 border border-gray-200 rounded-lg">
                    <p class="text-sm text-secondary">总资源数</p>
                    <p id="total-count" class="text-2xl font-medium">0</p>
                </div>
                <div class="p-4 border border-gray-200 rounded-lg">
                    <p class="text-sm text-secondary">可访问</p>
                    <p id="success-count" class="text-2xl font-medium text-success">0</p>
                </div>
                <div class="p-4 border border-gray-200 rounded-lg">
                    <p class="text-sm text-secondary">不可访问/异常</p>
                    <p id="error-count" class="text-2xl font-medium text-danger">0</p>
                </div>
            </div>
            <div class="mt-6">
                <button id="refresh-btn" class="px-4 py-2 bg-accent text-white rounded hover:bg-accent/90 transition-colors flex items-center">
                    <i class="fa fa-refresh mr-2"></i> 重新检查
                </button>
                <!-- 新增Unsplash密钥提示 -->
                <p class="text-xs text-warning mt-3 flex items-center">
                    <i class="fa fa-info-circle mr-1"></i> Unsplash检查需在主页配置API Key（index.html中UNSPLASH_ACCESS_KEY）
                </p>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="mb-8 p-8 text-center">
            <i class="fa fa-circle-o-notch fa-spin text-3xl text-accent mb-4"></i>
            <p>正在检查资源可用性...</p>
        </div>

        <!-- 资源列表 -->
        <div id="resources-container" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-medium">资源检查结果</h2>
                <div class="flex space-x-2">
                    <button id="filter-all" class="px-3 py-1 bg-accent text-white text-sm rounded">全部</button>
                    <button id="filter-success" class="px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-success hover:text-white transition-colors">可用</button>
                    <button id="filter-error" class="px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-danger hover:text-white transition-colors">不可用/异常</button>
                </div>
            </div>
            
            <div id="resources-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                <!-- 资源项将动态生成 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-primary text-white py-6 mt-12">
        <div class="container mx-auto px-6 text-center text-sm text-gray-400">
            © 2025 光影集 | 申家铖摄影作品
        </div>
    </footer>

    <script>
        // 需要检查的资源列表（新增Unsplash相关资源）
        const resourcesToCheck = [
            // 原有资源保持不变
            { url: 'https://cdn.pixabay.com/video/2018/03/21/15138-261402905_large.mp4', type: 'video', name: '英雄区域延时视频' },
            { url: 'https://www4.bing.com//th?id=OHR.OzoneEarth_ZH-CN0993915980_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp', type: 'image', name: '英雄区域备用图片' },
            { url: 'https://www.2008php.com/2019_Website_appreciate/2019-04-08/20190408225002qER57qER57.jpg', type: 'image', name: '摄影师肖像' },
            { url: 'https://raw.githubusercontent.com/JASON-SHEN-0225/JASON-SHEN-0225.github.io/main/photos/', type: 'image', name: '摄影作品文件夹' },
            { url: 'https://raw.githubusercontent.com/JASON-SHEN-0225/JASON-SHEN-0225.github.io/main/videos/', type: 'video', name: '视频作品文件夹' },
            { url: 'https://picsum.photos/800/600?video-placeholder', type: 'image', name: '视频备用封面picsum端' },
            { url: 'https://bing.img.run/1920x1080.php', type: 'image', name: '视频备用封面bing端' },
            
            // 新增Unsplash相关检查项
            { 
                url: 'https://api.unsplash.com/photos/random?orientation=landscape&w=800&h=600', 
                type: 'unsplash-api', // 自定义类型：Unsplash API端点检查
                name: 'Unsplash API端点可用性' 
            },
            { 
                url: 'https://source.unsplash.com/random/800x600', 
                type: 'unsplash-web', // 自定义类型：Unsplash网页图片源检查
                name: 'Unsplash网页图片源（source.unsplash.com）' 
            }
        ];

        // DOM元素
        const loadingEl = document.getElementById('loading');
        const resourcesContainer = document.getElementById('resources-container');
        const resourcesList = document.getElementById('resources-list');
        const totalCountEl = document.getElementById('total-count');
        const successCountEl = document.getElementById('success-count');
        const errorCountEl = document.getElementById('error-count');
        const refreshBtn = document.getElementById('refresh-btn');
        const filterAllBtn = document.getElementById('filter-all');
        const filterSuccessBtn = document.getElementById('filter-success');
        const filterErrorBtn = document.getElementById('filter-error');

        // 状态计数（新增warning状态，用于未配置密钥等非错误但需注意的情况）
        let stats = {
            total: 0,
            success: 0,
            error: 0,
            warning: 0 // 警告状态（如未配置密钥）
        };

        // 页面加载完成后检查资源
        document.addEventListener('DOMContentLoaded', () => {
            checkAllResources();
            
            // 事件监听
            refreshBtn.addEventListener('click', checkAllResources);
            filterAllBtn.addEventListener('click', () => filterResources('all'));
            filterSuccessBtn.addEventListener('click', () => filterResources('success'));
            filterErrorBtn.addEventListener('click', () => filterResources('error'));
        });

        // 检查所有资源
        function checkAllResources() {
            stats = { total: resourcesToCheck.length, success: 0, error: 0, warning: 0 };
            resourcesList.innerHTML = '';
            loadingEl.classList.remove('hidden');
            resourcesContainer.classList.add('hidden');
            updateStats();
            
            resourcesToCheck.forEach((resource, index) => {
                // 错开检查时间，避免同时发起太多请求
                setTimeout(() => {
                    checkResource(resource);
                }, index * 300);
            });
        }

        // 检查单个资源（新增Unsplash类型处理）
        function checkResource(resource) {
            // 创建资源项元素
            const resourceItem = document.createElement('div');
            resourceItem.className = 'resource-item p-4 border border-gray-200 rounded-lg flex flex-col md:flex-row md:items-center justify-between';
            resourceItem.dataset.status = 'checking';
            resourceItem.dataset.type = resource.type;
            
            resourceItem.innerHTML = `
                <div class="flex items-start mb-2 md:mb-0">
                    <div class="mr-3 mt-1">
                        <i class="fa fa-${getIconByType(resource.type)} text-secondary"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-sm md:text-base">${resource.name}</h3>
                        <p class="text-xs md:text-sm text-secondary break-all mt-1">${resource.url}</p>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="text-sm mr-2">检查中...</span>
                    <i class="fa fa-circle-o-notch fa-spin text-secondary"></i>
                </div>
            `;
            
            resourcesList.appendChild(resourceItem);

            // 根据资源类型使用不同的检查方法
            switch (resource.type) {
                case 'image':
                    checkImageResource(resource, resourceItem);
                    break;
                case 'video':
                    checkVideoResource(resource, resourceItem);
                    break;
                case 'unsplash-api':
                    checkUnsplashApiResource(resource, resourceItem); // Unsplash API检查
                    break;
                case 'unsplash-web':
                    checkImageResource(resource, resourceItem); // Unsplash网页图片用普通图片检查
                    break;
                default:
                    checkDefaultResource(resource, resourceItem);
            }
        }

        // 根据资源类型获取图标
        function getIconByType(type) {
            switch (type) {
                case 'image':
                case 'unsplash-web':
                    return 'image';
                case 'video':
                    return 'video-camera';
                case 'unsplash-api':
                    return 'code'; // API用代码图标
                default:
                    return 'link';
            }
        }

        // 检查图片资源（原有逻辑保留）
        function checkImageResource(resource, element) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = resource.url + (resource.url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            
            const timeout = setTimeout(() => {
                updateResourceStatus(element, false, '超时');
            }, 10000);
            
            img.onload = () => {
                clearTimeout(timeout);
                updateResourceStatus(element, true);
            };
            
            img.onerror = () => {
                clearTimeout(timeout);
                // 特殊处理摄影师肖像二次验证
                if (resource.name === '摄影师肖像') {
                    const secondCheck = new Image();
                    secondCheck.crossOrigin = 'anonymous';
                    secondCheck.src = resource.url;
                    secondCheck.onload = () => updateResourceStatus(element, true);
                    secondCheck.onerror = () => updateResourceStatus(element, false, '加载失败');
                } else {
                    updateResourceStatus(element, false, '加载失败');
                }
            };
        }

        // 检查视频资源（原有逻辑保留）
        function checkVideoResource(resource, element) {
            const video = document.createElement('video');
            video.crossOrigin = 'anonymous';
            video.src = resource.url + (resource.url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            
            const timeout = setTimeout(() => {
                updateResourceStatus(element, false, '超时');
            }, 15000);
            
            video.onloadedmetadata = () => {
                clearTimeout(timeout);
                updateResourceStatus(element, true);
            };
            
            video.onerror = () => {
                clearTimeout(timeout);
                fetch(resource.url, { method: 'HEAD', mode: 'cors' })
                    .then(response => {
                        if (response.ok) {
                            updateResourceStatus(element, true, 'HEAD请求成功（视频可访问）');
                        } else {
                            updateResourceStatus(element, false, `HTTP ${response.status}`);
                        }
                    })
                    .catch(() => {
                        updateResourceStatus(element, false, 'HEAD请求失败');
                    });
            };
        }

        // 检查Unsplash API资源（新增核心逻辑）
        function checkUnsplashApiResource(resource, element) {
            // 注意：此处仅检查API端点可访问性，实际使用需在主页配置密钥
            const unsplashHeaders = {
                'Accept-Version': 'v1',
                // 用占位符提示密钥配置，实际检查不依赖真实密钥（避免暴露风险）
                'Authorization': 'Client-ID YOUR_UNSPLASH_ACCESS_KEY（需在index.html配置）'
            };

            const timeout = setTimeout(() => {
                updateResourceStatus(element, false, 'API请求超时');
            }, 8000);

            fetch(resource.url, {
                method: 'GET',
                headers: unsplashHeaders,
                mode: 'cors'
            })
            .then(response => {
                clearTimeout(timeout);
                if (response.ok) {
                    // API返回成功（说明端点可访问，密钥有效性需在主页验证）
                    updateResourceStatus(element, true, 'API端点可访问（密钥需在主页配置）');
                } else if (response.status === 401) {
                    // 401：未授权（正常，因这里用的是占位符密钥）
                    updateResourceStatus(element, false, '未授权（需在index.html配置有效Unsplash API Key）', 'warning');
                } else if (response.status === 429) {
                    // 429：请求超限
                    updateResourceStatus(element, false, 'API请求超限（每日限额1000次）', 'warning');
                } else {
                    // 其他错误状态
                    updateResourceStatus(element, false, `API错误（HTTP ${response.status}）`);
                }
            })
            .catch(error => {
                clearTimeout(timeout);
                updateResourceStatus(element, false, `网络错误：${error.message}`);
            });
        }

        // 检查默认资源（通用逻辑）
        function checkDefaultResource(resource, element) {
            const timeout = setTimeout(() => {
                updateResourceStatus(element, false, '请求超时');
            }, 10000);

            fetch(resource.url, { method: 'HEAD', mode: 'cors' })
                .then(response => {
                    clearTimeout(timeout);
                    if (response.ok) {
                        updateResourceStatus(element, true);
                    } else {
                        updateResourceStatus(element, false, `HTTP ${response.status}`);
                    }
                })
                .catch(error => {
                    clearTimeout(timeout);
                    updateResourceStatus(element, false, `请求失败：${error.message}`);
                });
        }

        // 更新资源状态显示（新增warning状态处理）
        function updateResourceStatus(element, isSuccess, note = '', statusType = '') {
            // 确定最终状态（优先级：warning > success > error）
            let finalStatus = statusType === 'warning' ? 'warning' : (isSuccess ? 'success' : 'error');
            
            // 更新计数
            if (finalStatus === 'success') stats.success++;
            else if (finalStatus === 'error') stats.error++;
            else if (finalStatus === 'warning') stats.warning++;

            // 状态样式与文本配置
            const statusConfig = {
                success: { color: 'text-success', bg: 'bg-success', text: '可访问' },
                error: { color: 'text-danger', bg: 'bg-danger', text: '不可访问' },
                warning: { color: 'text-warning', bg: 'bg-warning', text: '需注意' }
            };
            const config = statusConfig[finalStatus];

            // 补充说明（非空时显示）
            const noteHtml = note ? `<p class="text-xs mt-1 ${config.color}">${note}</p>` : '';

            // 更新元素内容
            element.dataset.status = finalStatus;
            element.innerHTML = `
                <div class="flex items-start mb-2 md:mb-0">
                    <div class="mr-3 mt-1">
                        <i class="fa fa-${getIconByType(element.dataset.type)} ${config.color}"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-sm md:text-base">${element.querySelector('h3').textContent}</h3>
                        <p class="text-xs md:text-sm text-secondary break-all mt-1">${element.querySelector('p').textContent}</p>
                        ${noteHtml}
                    </div>
                </div>
                <div class="flex items-center ${config.color}">
                    <span class="status-indicator ${config.bg} mr-2"></span>
                    <span class="text-sm">${config.text}</span>
                </div>
            `;
            
            // 添加淡入动画
            element.classList.add('fade-in');
            
            // 更新统计数据
            updateStats();
            
            // 所有资源检查完成后隐藏加载状态
            if (stats.success + stats.error + stats.warning === stats.total) {
                loadingEl.classList.add('hidden');
                resourcesContainer.classList.remove('hidden');
            }
        }

        // 更新统计数据显示（新增warning计数合并到error显示，避免用户混淆）
        function updateStats() {
            totalCountEl.textContent = stats.total;
            successCountEl.textContent = stats.success;
            // 异常数 = 错误数 + 警告数（用户更关注"非可用"状态）
            errorCountEl.textContent = stats.error + stats.warning;
        }

        // 筛选资源显示（支持warning状态筛选）
        function filterResources(filter) {
            const allItems = document.querySelectorAll('.resource-item');
            
            // 更新按钮样式
            filterAllBtn.className = 'px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-accent hover:text-white transition-colors';
            filterSuccessBtn.className = 'px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-success hover:text-white transition-colors';
            filterErrorBtn.className = 'px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-danger hover:text-white transition-colors';
            
            if (filter === 'all') {
                filterAllBtn.className = 'px-3 py-1 bg-accent text-white text-sm rounded';
                allItems.forEach(item => item.classList.remove('hidden'));
            } else if (filter === 'success') {
                filterSuccessBtn.className = 'px-3 py-1 bg-success text-white text-sm rounded';
                allItems.forEach(item => {
                    item.dataset.status === 'success' ? item.classList.remove('hidden') : item.classList.add('hidden');
                });
            } else if (filter === 'error') {
                filterErrorBtn.className = 'px-3 py-1 bg-danger text-white text-sm rounded';
                allItems.forEach(item => {
                    // 筛选"错误"和"警告"状态（均视为异常）
                    ['error', 'warning'].includes(item.dataset.status) 
                        ? item.classList.remove('hidden') 
                        : item.classList.add('hidden');
                });
            }
        }
    </script>
</body>
</html>
