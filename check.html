<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源状态检查 | 光影集</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        secondary: 'var(--color-secondary)',
                        accent: 'var(--color-accent)',
                        success: '#4CAF50',
                        danger: '#f44336',
                        light: 'var(--color-bg-light)',
                        dark: 'var(--color-bg-dark)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .status-indicator {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                display: inline-block;
            }
            .resource-item {
                transition: all 0.3s ease;
            }
            .resource-item:hover {
                background-color: rgba(212, 175, 55, 0.05);
            }
            .fade-in {
                animation: fadeIn 0.5s ease-in;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            /* 黑夜模式切换开关（带太阳月亮图标） */
            .theme-toggle {
                position: relative;
                width: 56px;
                height: 26px;
                margin-left: 1rem;
            }
            .theme-toggle input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .theme-slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: var(--color-secondary);
                transition: 0.4s;
                border-radius: 24px;
            }
            .theme-slider:before {
                position: absolute;
                content: "";
                height: 18px;
                width: 18px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                transition: 0.4s;
                border-radius: 50%;
            }
            input:checked + .theme-slider {
                background-color: var(--color-accent);
            }
            input:checked + .theme-slider:before {
                transform: translateX(30px);
            }
            /* 太阳月亮图标 */
            .theme-icon {
                position: absolute;
                z-index: 1;
                top: 50%;
                transform: translateY(-50%);
                font-size: 12px;
                color: white;
            }
            .sun-icon {
                left: 8px;
            }
            .moon-icon {
                right: 8px;
            }
        }
    </style>
    
    <!-- CSS变量定义（与主站保持一致） -->
    <style>
        :root {
            /* 白天模式 */
            --color-primary: #1a1a1a;
            --color-secondary: #666666;
            --color-accent: #d4af37;
            --color-bg-light: #f8f8f8;
            --color-bg-white: #ffffff;
            --color-bg-dark: #0f0f0f;
        }
        
        /* 黑夜模式 */
        .dark {
            --color-primary: #f5f5f5;
            --color-secondary: #bbbbbb;
            --color-accent: #f0d779;
            --color-bg-light: #121212;
            --color-bg-white: #1e1e1e;
        }
        
        /* 平滑过渡 */
        body, header, .bg-white, .border-gray-200 {
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }
    </style>
</head>
<body class="bg-light text-primary min-h-screen">
    <!-- 导航栏 -->
    <header class="bg-white shadow-sm py-4 sticky top-0 z-30">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <h1 class="text-xl font-medium">
                <span class="text-primary">光影</span><span class="text-accent">.</span>
                <span class="text-sm text-secondary ml-2">资源状态检查</span>
            </h1>
            <div class="flex items-center">
                <label class="theme-toggle">
                    <i class="theme-icon sun-icon fa fa-sun-o"></i>
                    <i class="theme-icon moon-icon fa fa-moon-o"></i>
                    <input type="checkbox" id="theme-switch">
                    <span class="theme-slider"></span>
                </label>
                <a href="index.html" class="text-sm text-secondary hover:text-accent transition-colors flex items-center ml-4">
                    <i class="fa fa-arrow-left mr-1"></i> 返回主页
                </a>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-6 py-10">
        <!-- 总体状态 -->
        <div class="mb-8 p-6 bg-white rounded-lg shadow-sm">
            <h2 class="text-xl font-medium mb-4 flex items-center">
                <i class="fa fa-dashboard text-accent mr-2"></i> 总体状态
            </h2>
            <div id="summary" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 border border-gray-200 rounded-lg">
                    <p class="text-sm text-secondary">总资源数</p>
                    <p id="total-count" class="text-2xl font-medium">0</p>
                </div>
                <div class="p-4 border border-gray-200 rounded-lg">
                    <p class="text-sm text-secondary">可访问</p>
                    <p id="success-count" class="text-2xl font-medium text-success">0</p>
                </div>
                <div class="p-4 border border-gray-200 rounded-lg">
                    <p class="text-sm text-secondary">不可访问</p>
                    <p id="error-count" class="text-2xl font-medium text-danger">0</p>
                </div>
            </div>
            <div class="mt-6">
                <button id="refresh-btn" class="px-4 py-2 bg-accent text-white rounded hover:bg-accent/90 transition-colors flex items-center">
                    <i class="fa fa-refresh mr-2"></i> 重新检查
                </button>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="mb-8 p-8 text-center">
            <i class="fa fa-circle-o-notch fa-spin text-3xl text-accent mb-4"></i>
            <p>正在检查资源可用性...</p>
        </div>

        <!-- 资源列表 -->
        <div id="resources-container" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-medium">资源检查结果</h2>
                <div class="flex space-x-2">
                    <button id="filter-all" class="px-3 py-1 bg-accent text-white text-sm rounded">全部</button>
                    <button id="filter-success" class="px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-success hover:text-white transition-colors">可用</button>
                    <button id="filter-error" class="px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-danger hover:text-white transition-colors">不可用</button>
                </div>
            </div>
            
            <div id="resources-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                <!-- 资源项将动态生成 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-primary text-white py-6 mt-12">
        <div class="container mx-auto px-6 text-center text-sm text-gray-400">
            © 2025 光影集 | 申家铖摄影作品
        </div>
    </footer>

    <script>
        // 需要检查的资源列表
        const resourcesToCheck = [
            // 英雄区域视频
            { url: 'https://cdn.pixabay.com/video/2018/03/21/15138-261402905_large.mp4', type: 'video', name: '英雄区域延时视频' },
            { url: 'https://www4.bing.com//th?id=OHR.OzoneEarth_ZH-CN0993915980_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp', type: 'image', name: '英雄区域备用图片' },
            
            // 关于页面图片
            { url: 'https://www.2008php.com/2019_Website_appreciate/2019-04-08/20190408225002qER57qER57.jpg', type: 'image', name: '摄影师肖像' },
            
            // GitHub图片资源示例
            { url: 'https://raw.githubusercontent.com/JASON-SHEN-0225/JASON-SHEN-0225.github.io/main/photos/', type: 'image', name: '摄影作品文件夹' },
            
            // GitHub视频资源示例
            { url: 'https://raw.githubusercontent.com/JASON-SHEN-0225/JASON-SHEN-0225.github.io/main/videos/', type: 'video', name: '视频作品文件夹' },
            
            // 视频封面备用图
            { url: 'https://picsum.photos/800/600?video-placeholder', type: 'image', name: '视频备用封面' }
        ];

        // DOM元素
        const loadingEl = document.getElementById('loading');
        const resourcesContainer = document.getElementById('resources-container');
        const resourcesList = document.getElementById('resources-list');
        const totalCountEl = document.getElementById('total-count');
        const successCountEl = document.getElementById('success-count');
        const errorCountEl = document.getElementById('error-count');
        const refreshBtn = document.getElementById('refresh-btn');
        const filterAllBtn = document.getElementById('filter-all');
        const filterSuccessBtn = document.getElementById('filter-success');
        const filterErrorBtn = document.getElementById('filter-error');
        const themeSwitch = document.getElementById('theme-switch');

        // 状态计数
        let stats = {
            total: 0,
            success: 0,
            error: 0
        };

        // 页面加载完成后检查资源
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化黑夜模式
            initDarkMode();
            checkAllResources();
            
            // 事件监听
            refreshBtn.addEventListener('click', checkAllResources);
            filterAllBtn.addEventListener('click', () => filterResources('all'));
            filterSuccessBtn.addEventListener('click', () => filterResources('success'));
            filterErrorBtn.addEventListener('click', () => filterResources('error'));
            themeSwitch.addEventListener('change', toggleDarkMode);
        });

        /**
         * 初始化黑夜模式
         */
        function initDarkMode() {
            const isDarkMode = localStorage.getItem('darkMode') === 'true' || 
                              (localStorage.getItem('darkMode') === null && 
                               window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDarkMode) {
                document.body.classList.add('dark');
                themeSwitch.checked = true;
            }
        }
        
        /**
         * 切换黑夜模式
         */
        function toggleDarkMode() {
            const isDarkMode = !document.body.classList.contains('dark');
            document.body.classList.toggle('dark', isDarkMode);
            themeSwitch.checked = isDarkMode;
            localStorage.setItem('darkMode', isDarkMode);
        }

        // 检查所有资源
        function checkAllResources() {
            stats = { total: resourcesToCheck.length, success: 0, error: 0 };
            resourcesList.innerHTML = '';
            loadingEl.classList.remove('hidden');
            resourcesContainer.classList.add('hidden');
            updateStats();
            
            resourcesToCheck.forEach((resource, index) => {
                setTimeout(() => {
                    checkResource(resource);
                }, index * 300);
            });
        }

        // 检查单个资源
        function checkResource(resource) {
            const resourceItem = document.createElement('div');
            resourceItem.className = 'resource-item p-4 border border-gray-200 rounded-lg flex flex-col md:flex-row md:items-center justify-between';
            resourceItem.dataset.status = 'checking';
            resourceItem.dataset.type = resource.type;
            
            resourceItem.innerHTML = `
                <div class="flex items-start mb-2 md:mb-0">
                    <div class="mr-3 mt-1">
                        <i class="fa fa-${resource.type === 'image' ? 'image' : 'video-camera'} text-secondary"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-sm md:text-base">${resource.name}</h3>
                        <p class="text-xs md:text-sm text-secondary break-all mt-1">${resource.url}</p>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="text-sm mr-2">检查中...</span>
                    <i class="fa fa-circle-o-notch fa-spin text-secondary"></i>
                </div>
            `;
            
            resourcesList.appendChild(resourceItem);

            fetch(resource.url, { method: 'HEAD' })
                .then(response => {
                    const isSuccess = response.ok;
                    updateResourceStatus(resourceItem, isSuccess);
                })
                .catch(error => {
                    updateResourceStatus(resourceItem, false);
                });
        }

        // 更新资源状态显示
        function updateResourceStatus(element, isSuccess) {
            if (isSuccess) {
                stats.success++;
                element.dataset.status = 'success';
                element.innerHTML = `
                    <div class="flex items-start mb-2 md:mb-0">
                        <div class="mr-3 mt-1">
                            <i class="fa fa-${element.dataset.type === 'image' ? 'image' : 'video-camera'} text-secondary"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-sm md:text-base">${element.querySelector('h3').textContent}</h3>
                            <p class="text-xs md:text-sm text-secondary break-all mt-1">${element.querySelector('p').textContent}</p>
                        </div>
                    </div>
                    <div class="flex items-center text-success">
                        <span class="status-indicator bg-success mr-2"></span>
                        <span class="text-sm">可访问</span>
                    </div>
                `;
            } else {
                stats.error++;
                element.dataset.status = 'error';
                element.innerHTML = `
                    <div class="flex items-start mb-2 md:mb-0">
                        <div class="mr-3 mt-1">
                            <i class="fa fa-${element.dataset.type === 'image' ? 'image' : 'video-camera'} text-secondary"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-sm md:text-base">${element.querySelector('h3').textContent}</h3>
                            <p class="text-xs md:text-sm text-secondary break-all mt-1">${element.querySelector('p').textContent}</p>
                        </div>
                    </div>
                    <div class="flex items-center text-danger">
                        <span class="status-indicator bg-danger mr-2"></span>
                        <span class="text-sm">不可访问</span>
                    </div>
                `;
            }
            
            element.classList.add('fade-in');
            updateStats();
            
            if (stats.success + stats.error === stats.total) {
                loadingEl.classList.add('hidden');
                resourcesContainer.classList.remove('hidden');
            }
        }

        // 更新统计数据显示
        function updateStats() {
            totalCountEl.textContent = stats.total;
            successCountEl.textContent = stats.success;
            errorCountEl.textContent = stats.error;
        }

        // 筛选资源显示
        function filterResources(filter) {
            const allItems = document.querySelectorAll('.resource-item');
            
            filterAllBtn.className = 'px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-accent hover:text-white transition-colors';
            filterSuccessBtn.className = 'px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-success hover:text-white transition-colors';
            filterErrorBtn.className = 'px-3 py-1 bg-gray-200 text-secondary text-sm rounded hover:bg-danger hover:text-white transition-colors';
            
            if (filter === 'all') {
                filterAllBtn.className = 'px-3 py-1 bg-accent text-white text-sm rounded';
                allItems.forEach(item => item.classList.remove('hidden'));
            } else if (filter === 'success') {
                filterSuccessBtn.className = 'px-3 py-1 bg-success text-white text-sm rounded';
                allItems.forEach(item => {
                    if (item.dataset.status === 'success') {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            } else if (filter === 'error') {
                filterErrorBtn.className = 'px-3 py-1 bg-danger text-white text-sm rounded';
                allItems.forEach(item => {
                    if (item.dataset.status === 'error') {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            }
        }
    </script>
</body>
</html>
